[[mods]]
modId="vonix_relicsfix"
version="1.0.1"
displayName="Vonix Relics Legacy API Shim (temporary)"
description="""Temporary server-side compatibility shim. Reliquified Ars Nouveau 0.7.1 calls AbilityData.isRankModifierUnlocked(String), a method Relics removed in 0.12.0. This mod merges that single method back onto AbilityData and delegates it to the 0.12.x replacement, AbilityData#getRankModifierData(id)#isUnlocked(). No gameplay values are changed. Remove this jar when Reliquified Ars Nouveau 0.8.0+ is installed."""

